name: Promote to production

# Manual: promote a UAT-tested cloud version to production. Nothing is rebuilt;
# the exact image already in the UAT ECR repository is copied to the production
# one, so production runs the bytes that were tested.
#
# Order: check ref + version -> confirm and pull the image with the UAT role ->
# snapshot the production database with the production role -> prune old
# snapshots -> push the image -> roll worker, then web -> health check -> move
# the `release` branch so Amplify builds the matching portal.
#
# Runs on main only: the production role trusts only
# repo:dloomes/av-bridge:ref:refs/heads/main. The UAT role's credentials are
# used strictly before the production role is assumed.

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, e.g. v1.0.96 (must already exist in the UAT ECR repository)"
        required: true
        type: string

permissions:
  id-token: write
  contents: write # git push of the release branch

concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  UAT_ROLE: arn:aws:iam::628088982408:role/github-deploy
  PROD_ROLE: arn:aws:iam::568339496641:role/github-deploy
  UAT_REPO_NAME: avrmm-uat-cloud
  UAT_ECR_REPO: 628088982408.dkr.ecr.eu-west-2.amazonaws.com/avrmm-uat-cloud
  PROD_ECR_REPO: 568339496641.dkr.ecr.eu-west-2.amazonaws.com/avrmm-prod-cloud
  PROD_CLUSTER: avrmm-prod-cluster
  PROD_WORKER_SERVICE: avrmm-prod-worker-cloud
  PROD_WEB_SERVICE: avrmm-prod-web-cloud
  PROD_DB: avrmm-prod-postgres
  HEALTH_URL: https://api.involvecloud.com/healthz
  # Passed as an environment variable only (never expanded inside a script);
  # the first step validates it before anything uses it.
  VERSION: ${{ inputs.version }}

jobs:
  promote:
    name: Promote ${{ inputs.version }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check branch and version
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "Promotion must run from main (this run is on ${REF}). Re-run the workflow with 'Use workflow from' set to main." >&2
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must look like v1.0.96 (got a value that does not match ^v[0-9]+\.[0-9]+\.[0-9]+\$)" >&2
            exit 1
          fi
          echo "OK: promoting ${VERSION} from main"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the version tag exists
        run: |
          set -euo pipefail
          if ! commit="$(git rev-list -n1 "refs/tags/${VERSION}" 2>/dev/null)"; then
            echo "git tag ${VERSION} not found; the portal cannot be matched to it" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "tag ${VERSION} (${commit}) is not on main; only releases merged to main can be promoted" >&2
            exit 1
          fi
          echo "OK: tag ${VERSION} -> ${commit} (on main)"

      # ---- UAT account: confirm and pull the image ----
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.UAT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Confirm the image exists in UAT
        run: |
          set -euo pipefail
          if ! aws ecr describe-images \
              --repository-name "${UAT_REPO_NAME}" \
              --image-ids "imageTag=${VERSION}" \
              --query 'imageDetails[0].imageDigest' --output text; then
            echo "${UAT_REPO_NAME}:${VERSION} was not found in UAT; release and test it in UAT first" >&2
            exit 1
          fi

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Pull the image from UAT
        run: |
          set -euo pipefail
          docker pull "${UAT_ECR_REPO}:${VERSION}"

      - name: Check the pulled image is this version
        run: |
          set -euo pipefail
          # The image is distroless (no shell), so copy the file out.
          cid="$(docker create "${UAT_ECR_REPO}:${VERSION}")"
          trap 'docker rm -f "${cid}" >/dev/null' EXIT
          docker cp "${cid}:/downloads/manifest.json" "${RUNNER_TEMP}/manifest.json"
          m="${RUNNER_TEMP}/manifest.json"
          echo "manifest version=$(jq -r '.version' "${m}")"
          jq -e --arg t "${VERSION}" '.version==$t' "${m}" >/dev/null \
            || { echo "image manifest version does not match ${VERSION}; refusing to promote" >&2; exit 1; }
          echo "manifest OK: version ${VERSION}"

      # ---- Production account from here on ----
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PROD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Snapshot the production database
        run: |
          set -euo pipefail
          # RDS identifiers allow letters, digits and hyphens only (start with
          # a letter, no double or trailing hyphen). Base: avrmm-prod-pre-v1-0-96.
          # Every snapshot gets -YYYYMMDDHHMM, which keeps the cleanup prefix
          # and makes a re-promotion of the same version a fresh snapshot.
          base="avrmm-prod-pre-${VERSION//./-}"
          recent="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%S)"
          list="$(aws rds describe-db-snapshots \
            --db-instance-identifier "${PROD_DB}" \
            --snapshot-type manual \
            --query 'DBSnapshots[].[DBSnapshotIdentifier,SnapshotCreateTime]' \
            --output text)"
          snap=""
          while IFS=$'\t' read -r id created; do
            [ -n "${id}" ] || continue
            case "${id}" in
              "${base}"-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              *) continue ;;
            esac
            case "${created}" in
              [0-9][0-9][0-9][0-9]-*) ;;
              *) created="9999" ;; # still being created: an earlier attempt's own
            esac
            if [[ "${created}" > "${recent}" ]]; then
              snap="${id}"
              break
            fi
          done <<< "${list}"
          if [ -n "${snap}" ]; then
            echo "Recent snapshot ${snap} exists (earlier attempt, under 6 hours old); reusing it"
          else
            snap="${base}-$(date -u +%Y%m%d%H%M)"
            echo "Creating snapshot ${snap}"
            aws rds create-db-snapshot \
              --db-instance-identifier "${PROD_DB}" \
              --db-snapshot-identifier "${snap}" \
              --query 'DBSnapshot.Status' --output text
          fi
          aws rds wait db-snapshot-available --db-snapshot-identifier "${snap}"
          echo "SNAPSHOT_ID=${snap}" >> "${GITHUB_ENV}"
          echo "Snapshot ${snap} is available"

      - name: Delete pre-release snapshots older than 365 days
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '365 days ago' +%Y-%m-%dT%H:%M:%S)"
          echo "Cutoff: ${cutoff}"
          deleted=0
          # Captured first so an API failure aborts the step (set -e) instead
          # of reading as "Deleted 0". Text: identifier <tab> creation time.
          list="$(aws rds describe-db-snapshots \
            --db-instance-identifier "${PROD_DB}" \
            --snapshot-type manual \
            --query 'DBSnapshots[].[DBSnapshotIdentifier,SnapshotCreateTime]' \
            --output text)"
          while IFS=$'\t' read -r id created; do
            [ -n "${id}" ] || continue
            case "${id}" in
              avrmm-prod-pre-*) ;;
              *) continue ;; # never touch any other snapshot
            esac
            case "${created}" in
              [0-9][0-9][0-9][0-9]-*) ;;
              *) continue ;; # still being created
            esac
            if [[ "${created}" < "${cutoff}" ]]; then
              echo "Deleting ${id} (created ${created})"
              aws rds delete-db-snapshot --db-snapshot-identifier "${id}" >/dev/null
              deleted=$((deleted + 1))
            fi
          done <<< "${list}"
          echo "Deleted ${deleted} old snapshot(s)"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Record the current production image (for rollback)
        id: prev
        run: |
          set -euo pipefail
          if ! out="$(aws ecr describe-images \
              --repository-name avrmm-prod-cloud \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].[imageDigest,join(`,`,imageTags)]' \
              --output text 2>&1)"; then
            if printf '%s' "${out}" | grep -q 'ImageNotFoundException'; then
              echo "No previous :latest in avrmm-prod-cloud (first promotion)"
              echo "PREV_DIGEST=none" >> "${GITHUB_ENV}"
              echo "PREV_TAGS=" >> "${GITHUB_ENV}"
              exit 0
            fi
            echo "could not read the current :latest: ${out}" >&2
            exit 1
          fi
          digest="$(printf '%s' "${out}" | cut -f1)"
          tags="$(printf '%s' "${out}" | cut -f2)"
          printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo "unexpected digest: ${digest}" >&2; exit 1; }
          # Keep only plain tag characters before it goes anywhere else.
          tags="$(printf '%s' "${tags}" | tr -cd 'A-Za-z0-9._,-')"
          echo "Current :latest digest ${digest}, tags ${tags}"
          echo "PREV_DIGEST=${digest}" >> "${GITHUB_ENV}"
          echo "PREV_TAGS=${tags}" >> "${GITHUB_ENV}"

      - name: Push the image to production
        id: push
        run: |
          set -euo pipefail
          docker tag "${UAT_ECR_REPO}:${VERSION}" "${PROD_ECR_REPO}:${VERSION}"
          docker tag "${UAT_ECR_REPO}:${VERSION}" "${PROD_ECR_REPO}:latest"
          docker push "${PROD_ECR_REPO}:${VERSION}"
          docker push "${PROD_ECR_REPO}:latest"
          echo "Pushed ${PROD_ECR_REPO}:${VERSION} and :latest"

      - name: Roll the worker service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${PROD_CLUSTER}" \
            --service "${PROD_WORKER_SERVICE}" \
            --force-new-deployment \
            --query 'service.deployments[0].rolloutState' --output text
          aws ecs wait services-stable \
            --cluster "${PROD_CLUSTER}" \
            --services "${PROD_WORKER_SERVICE}"
          echo "${PROD_WORKER_SERVICE} is stable"

      - name: Roll the web service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${PROD_CLUSTER}" \
            --service "${PROD_WEB_SERVICE}" \
            --force-new-deployment \
            --query 'service.deployments[0].rolloutState' --output text
          aws ecs wait services-stable \
            --cluster "${PROD_CLUSTER}" \
            --services "${PROD_WEB_SERVICE}"
          echo "${PROD_WEB_SERVICE} is stable"

      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "${HEALTH_URL}"
          echo
          echo "Health check OK"

      - name: Move the release branch (Amplify builds the portal)
        run: |
          set -euo pipefail
          commit="$(git rev-list -n1 "refs/tags/${VERSION}")"
          echo "Pushing ${commit} (${VERSION}) to refs/heads/release"
          git push origin "${commit}:refs/heads/release" --force
          echo "release branch now at ${commit}"

      - name: Rollback instructions
        if: failure() && steps.push.outcome != 'skipped'
        run: |
          set -euo pipefail
          {
            echo "## Promotion of ${VERSION} failed after the image push started"
            echo
            echo "Production :latest may now point at ${VERSION}."
            if [ "${PREV_DIGEST:-none}" = "none" ] || [ -z "${PREV_DIGEST:-}" ]; then
              echo
              echo "There was no previous :latest in avrmm-prod-cloud (first promotion), so there is no image to roll back to. Fix forward."
            else
              echo
              echo "Previous image: ${PREV_DIGEST} (tags: ${PREV_TAGS:-none})."
              echo
              echo "Roll back with prod credentials in ${AWS_REGION}. ECR has no retag command, so :latest is re-pointed by putting the old manifest back:"
              echo
              echo '```sh'
              echo "aws ecr batch-get-image --repository-name avrmm-prod-cloud \\"
              echo "  --image-ids imageDigest=${PREV_DIGEST} \\"
              echo "  --query 'images[0].imageManifest' --output text > prev-manifest.json"
              echo "aws ecr put-image --repository-name avrmm-prod-cloud --image-tag latest \\"
              echo "  --image-manifest file://prev-manifest.json"
              echo "aws ecs update-service --cluster ${PROD_CLUSTER} --service ${PROD_WORKER_SERVICE} --force-new-deployment"
              echo "aws ecs wait services-stable --cluster ${PROD_CLUSTER} --services ${PROD_WORKER_SERVICE}"
              echo "aws ecs update-service --cluster ${PROD_CLUSTER} --service ${PROD_WEB_SERVICE} --force-new-deployment"
              echo "aws ecs wait services-stable --cluster ${PROD_CLUSTER} --services ${PROD_WEB_SERVICE}"
              echo '```'
            fi
            echo
            echo "Database snapshot taken before this release: ${SNAPSHOT_ID:-unknown} (restore only if a migration damaged data)."
          } | tee -a "${GITHUB_STEP_SUMMARY}"
