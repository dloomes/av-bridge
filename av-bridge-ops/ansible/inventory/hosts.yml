# inventory/hosts.yml
# Each site is a host. Group by region or customer as needed.
# Use ansible-vault to encrypt sensitive vars, or point to your secrets manager.

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/av-bridge-deploy
    ansible_python_interpreter: /usr/bin/python3

  children:
    av_bridge_sites:
      children:

        uk_sites:
          hosts:
            site-london-01:
              ansible_host: 10.10.1.50
              av_bridge_site_id: london-01
              av_bridge_location: "London, UK"

            site-manchester-01:
              ansible_host: 10.10.2.50
              av_bridge_site_id: manchester-01
              av_bridge_location: "Manchester, UK"

        us_sites:
          hosts:
            site-nyc-01:
              ansible_host: 10.20.1.50
              av_bridge_site_id: nyc-01
              av_bridge_location: "New York, US"

            site-la-01:
              ansible_host: 10.20.2.50
              av_bridge_site_id: la-01
              av_bridge_location: "Los Angeles, US"
